<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目展示中心</title>
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#18263a;--sub:#6d7a8d;--line:#d7e0ea;--blue:#244b73;--gold:#b47b20;--red:#b94b4b}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf2f8,#f8f9fb);color:var(--ink);font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}header{max-width:1180px;margin:auto;padding:24px 22px 14px;display:flex;align-items:end;justify-content:space-between;gap:20px}h1{font-size:24px;margin:0;letter-spacing:.04em}.sub{color:var(--sub);font-size:13px;margin-top:2px}.status{color:var(--sub);font-size:12px;text-align:right}.nav{max-width:1180px;margin:0 auto 12px;padding:0 22px;display:flex;gap:8px;flex-wrap:wrap}.nav button{border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer;font:inherit;box-shadow:0 3px 10px #243a5b0d}.nav button.active{background:var(--blue);border-color:var(--blue);color:#fff}.nav button span{display:block;font-size:11px;opacity:.7}.stage{max-width:1180px;margin:0 auto;padding:0 22px 30px}.frame{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 12px 32px #243a5b14;min-height:720px}.frame iframe{display:block;width:100%;height:760px;border:0;background:#fff}.hint{max-width:1180px;margin:0 auto;padding:0 22px 18px;color:var(--sub);font-size:12px}@media(max-width:700px){header{display:block;padding:18px 14px 10px}.status{text-align:left;margin-top:6px}.nav,.stage{padding-left:12px;padding-right:12px}.frame iframe{height:820px}}
.frame iframe[hidden]{display:none}
@media(max-width:700px){
  :root{--mobile-deep:#080c18;--mobile-ink:#f3f6ff;--mobile-accent:#83a8ff}
  html,body{height:100%;overflow:hidden}
  body{background:radial-gradient(circle at 50% -10%,#263b78 0,#121a36 42%,var(--mobile-deep) 100%);color:var(--mobile-ink)}
  header{display:none!important}
  .stage{height:calc(100dvh - 64px - env(safe-area-inset-bottom));padding:0;margin:0;max-width:none}.frame{height:100%;min-height:0;border:0;border-radius:0;background:transparent;box-shadow:none}
  .frame iframe{height:100%;background:transparent}.hint{display:none}
  .nav{position:fixed;z-index:20;left:0;right:0;bottom:0;height:calc(64px + env(safe-area-inset-bottom));margin:0;padding:6px 10px max(6px,env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:rgba(7,11,24,.96);border-top:1px solid rgba(139,169,240,.18);backdrop-filter:blur(20px)}
  .nav button{min-width:0;margin:0;padding:3px 4px;border:0;border-radius:13px;background:transparent;color:#7f8bab;font-size:0;line-height:1;box-shadow:none}
  .nav button::before{content:attr(data-icon);display:block;width:27px;height:27px;margin:0 auto 3px;border:1px solid rgba(255,255,255,.1);border-radius:9px;background:rgba(255,255,255,.055);font:16px/25px Georgia,"Times New Roman",serif;transition:.18s}
  .nav button::after{content:attr(data-short);display:block;font-size:10px;font-weight:650;letter-spacing:.05em;line-height:1.1}
  .nav button.active{background:transparent;border:0;color:#a9c1ff;box-shadow:none}
  .nav button.active::before{border-color:#a9c3ff;background:linear-gradient(145deg,#9fc0ff,#5878dc);color:#091126;box-shadow:0 4px 15px rgba(90,123,222,.32);transform:translateY(-1px)}
  .nav button span{display:none}
}
@media(max-width:700px){
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 16%,rgba(105,145,255,.14),transparent 28%),radial-gradient(circle at 88% 36%,rgba(123,92,255,.1),transparent 30%);mix-blend-mode:screen}
  .stage{height:calc(100dvh - 84px - env(safe-area-inset-bottom))}
  .nav{left:12px;right:12px;bottom:max(8px,env(safe-area-inset-bottom));height:68px;padding:7px 12px;gap:10px;border:1px solid rgba(163,187,247,.16);border-radius:22px;background:linear-gradient(145deg,rgba(17,24,49,.91),rgba(7,11,24,.95));box-shadow:0 18px 42px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(24px) saturate(145%)}
  .nav::before{content:"";position:absolute;left:24px;right:24px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(188,207,255,.5),transparent)}
  .nav button{position:relative;border-radius:16px;transition:transform .18s ease,color .18s ease}
  .nav button:active{transform:scale(.94)}
  .nav button::before{width:30px;height:30px;margin-bottom:4px;border-radius:10px;font-size:17px;line-height:28px;box-shadow:inset 0 1px rgba(255,255,255,.07)}
  .nav button::after{font-size:10px;letter-spacing:.08em}
  .nav button.active::before{box-shadow:0 7px 20px rgba(79,111,213,.42),inset 0 1px rgba(255,255,255,.55)}
}
@media(max-width:700px){
  :root{--mobile-deep:#050c08;--mobile-ink:#f2f6f2;--mobile-accent:#72d6a3}
  body{background:radial-gradient(circle at 50% -10%,#22583f 0,#0c261a 42%,var(--mobile-deep) 100%)}
  body::before{background:radial-gradient(circle at 16% 14%,rgba(78,196,139,.14),transparent 29%),radial-gradient(circle at 88% 34%,rgba(44,137,92,.12),transparent 31%)}
  .nav{border-color:rgba(131,193,160,.18);background:linear-gradient(145deg,rgba(15,42,29,.92),rgba(5,16,10,.96));box-shadow:0 18px 42px rgba(0,0,0,.45),inset 0 1px rgba(255,255,255,.07)}
  .nav::before{background:linear-gradient(90deg,transparent,rgba(174,226,198,.48),transparent)}
  .nav button{color:#789383}.nav button::before{border-color:rgba(152,203,176,.12);background:rgba(255,255,255,.045)}
  .nav button.active{color:#a9e2c3}.nav button.active::before{border-color:#9ad8b8;background:linear-gradient(145deg,#8cdeb3,#3b9569);color:#06130c;box-shadow:0 7px 20px rgba(45,143,96,.42),inset 0 1px rgba(255,255,255,.5)}
}
</style>
</head>
<body>
<header><div><h1>项目展示中心</h1><div class="sub">三个功能模块 · 统一入口</div></div><div class="status" id="runStatus">正在识别运行环境…</div></header>
<nav class="nav" aria-label="功能模块">
  <button class="active" data-icon="十" data-short="红十" data-target="red10Frame" data-port="8899" data-path="red10/" data-online="https://xiaohuan1314-red10-game.onrender.com/">红十战略开发<span>真人联机</span></button>
  <button data-icon="♞" data-short="赛马" data-target="pokerFrame" data-port="8787" data-path="poker/" data-online="https://xiaohuan1314-poker-game.onrender.com/">赛马安卓讨论会议<span>真人联机</span></button>
  <button data-icon="◉" data-short="干瞪眼" data-target="dryeyeFrame" data-port="8895" data-path="dryeye/?preview=2" data-online="https://xiaohuan1314-dryeye-game.onrender.com/">干瞪眼 iOS 商业落地<span>真人联机</span></button>
</nav>
<section class="stage"><div class="frame">
  <iframe id="red10Frame" title="红十模块"></iframe>
  <iframe id="pokerFrame" title="赛马模块" hidden></iframe>
  <iframe id="dryeyeFrame" title="干瞪眼模块" hidden></iframe>
</div></section>
<div class="hint" id="runHint"></div>
<script>
const buttons=[...document.querySelectorAll('.nav button')];
const frames=[...document.querySelectorAll('.frame iframe')];
const isLocal=['localhost','127.0.0.1'].includes(location.hostname)||location.protocol==='file:';
function moduleUrl(btn){return isLocal?`http://localhost:${btn.dataset.port}/`:(btn.dataset.online||btn.dataset.path)}
function openModule(btn){
  buttons.forEach(x=>x.classList.remove('active'));
  buttons.forEach(x=>x.removeAttribute('aria-current'));
  btn.classList.add('active');
  btn.setAttribute('aria-current','page');
  const frame=document.getElementById(btn.dataset.target);
  frames.forEach(x=>x.hidden=x!==frame);
  if(!frame.hasAttribute('src')) frame.src=moduleUrl(btn);
}
buttons.forEach(btn=>btn.addEventListener('click',()=>openModule(btn)));
document.getElementById('runStatus').innerHTML=isLocal?'本地完整运行<br>模块独立，数据互不干扰':'GitHub Pages 在线预览<br>源代码已同步';
document.getElementById('runHint').textContent=isLocal?'启动方式：双击本文件夹里的“启动棋牌合集.bat”。如果某个模块显示连接中，请确认启动窗口仍在运行。':'三个模块均已接入外网真人联机。切换模块不会退出原房间；免费服务长时间无人访问后，首次打开可能需要等待约一分钟。';
openModule(buttons[0]);
</script>
</body></html>
